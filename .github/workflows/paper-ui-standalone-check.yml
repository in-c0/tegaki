name: Paper UI standalone extraction verification

on:
  push:
    branches:
      - feature/whispers-paper-ui
    paths:
      - '.github/workflows/paper-ui-standalone-check.yml'
  workflow_dispatch:

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export/paper-ui
      - uses: oven-sh/setup-bun@v2
      - name: Install independent workspace
        run: bun install
      - name: Save reproducible lockfile
        run: |
          echo 'LOCKFILE_B64_BEGIN'
          base64 -w0 bun.lock
          echo
          echo 'LOCKFILE_B64_END'
      - name: Build distributable React UI package and studio
        run: bun run build
      - name: Unit tests
        run: bun run test
      - name: Verify npm package dry run
        run: cd packages/paper-ui && npm pack --dry-run
      - name: Check compiled public entrypoints
        run: |
          test -f packages/paper-ui/dist/index.js
          test -f packages/paper-ui/dist/index.d.ts
          test -f packages/paper-ui/dist/paper.css
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Browser functionality and mobile screenshots
        run: bun run test:browser
      - name: Save QA assets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-ui-independent-release-qa
          path: |
            apps/studio/test-results/
            apps/studio/playwright-report/
          retention-days: 7
