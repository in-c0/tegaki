name: Paper UI checks

on:
  push:
    branches:
      - feature/whispers-paper-ui
    paths:
      - 'packages/paper-ui/**'
      - 'examples/paper-ui/**'
      - '.github/workflows/paper-ui.yml'
      - 'bun.lock'
  pull_request:
    paths:
      - 'packages/paper-ui/**'
      - 'examples/paper-ui/**'
      - '.github/workflows/paper-ui.yml'
      - 'bun.lock'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Check tracked source formatting
        run: bunx biome check packages/paper-ui examples/paper-ui
      - name: Typecheck components
        run: bun --filter @in-c0/paper-ui typecheck
      - name: Unit tests
        run: bun --filter @in-c0/paper-ui test
      - name: Typecheck demo
        run: bun --filter @in-c0/example-paper-ui typecheck
      - name: Build interactive studio
        run: bun --filter @in-c0/example-paper-ui build

  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium browser
        run: bunx playwright install --with-deps chromium
      - name: Interactions, mobile layout and runtime assertions
        run: bunx playwright test --config examples/paper-ui/playwright.config.ts
      - name: Save screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ui-browser-results
          path: |
            examples/paper-ui/test-results/
            examples/paper-ui/playwright-report/
          retention-days: 7

  independent-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export/paper-ui
      - uses: oven-sh/setup-bun@v2
      - name: Install standalone source
        run: bun install
      - name: Record independent dependency lock for review
        run: |
          echo 'LOCKFILE_B64_BEGIN'
          base64 -w0 bun.lock
          echo
          echo 'LOCKFILE_B64_END'
      - name: Build independent package and public studio
        run: bun run build
      - name: Run isolated unit tests
        run: bun run test
      - name: Check published tarball contents without publishing
        run: cd packages/paper-ui && npm pack --dry-run
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser accessibility and mobile interactions
        run: bun run test:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-ui-standalone-checks
          path: |
            apps/studio/test-results/
            apps/studio/playwright-report/
          retention-days: 7

  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export/paper-ui
      - name: Create standalone, history-free source archive
        run: git archive --format=zip --output paper-ui-standalone.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: paper-ui-standalone-source
          path: paper-ui-standalone.zip
          retention-days: 30
