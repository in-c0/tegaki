name: Paper UI checks

on:
  push:
    branches:
      - feature/whispers-paper-ui
    paths:
      - 'packages/paper-ui/**'
      - 'examples/paper-ui/**'
      - '.github/workflows/paper-ui.yml'
      - 'bun.lock'
  pull_request:
    paths:
      - 'packages/paper-ui/**'
      - 'examples/paper-ui/**'
      - '.github/workflows/paper-ui.yml'
      - 'bun.lock'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Format components and record patch for review
        run: |
          bunx biome check --write packages/paper-ui examples/paper-ui || true
          echo "FORMAT_PATCH_BEGIN"
          git diff -- packages/paper-ui examples/paper-ui
          echo "FORMAT_PATCH_END"
      - name: Typecheck components
        run: bun --filter @in-c0/paper-ui typecheck
      - name: Unit tests
        run: bun --filter @in-c0/paper-ui test
      - name: Typecheck demo
        run: bun --filter @in-c0/example-paper-ui typecheck
      - name: Build interactive demo
        run: bun --filter @in-c0/example-paper-ui build
